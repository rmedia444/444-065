    <script>
      let value = 989870273;
      var count_up = 0;
      var countdownElement = document.getElementById("result");

      var countdownInterval = function () {
        value++;
        count_up++;
        countdownElement.innerHTML = (value / 100)
          .toFixed(2)
          .replace(/\d(?=(\d{3})+\.)/g, "$&,");
      };

      var intervalID = window.setInterval(countdownInterval, 10);

      countdown(4);

      function countdown(minutes) {
        var seconds = 60;
        var mins = minutes;

        function tick() {
          var counter = document.getElementById("counter");
          var current_minutes = mins - 1;
          seconds--;
          counter.innerHTML =
            current_minutes.toString() +
            ":" +
            (seconds < 10 ? "0" : "") +
            String(seconds);
          if (seconds > 0) {
            setTimeout(tick, 1000);
          } else {
            if (mins > 1) {
              countdown(mins - 1);
            }
          }
        }
        tick();
      }
